[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finxl-ai-interviewer"
version = "0.1.0"
description = "Provider-independent backend foundation for FINXL AI Interviewer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "alembic>=1.13,<2",
  "google-genai>=1.0,<2",
  "pyjwt[crypto]>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "types-PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not gemini_live'"
markers = ["postgres: requires a dedicated empty PostgreSQL test database", "gemini_live: explicitly enabled live provider smoke test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
plugins = ["pydantic.mypy"]
